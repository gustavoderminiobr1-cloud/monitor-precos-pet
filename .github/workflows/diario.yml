# Automação: roda a ferramenta todo dia às 8h (horário de Brasília)
# e salva o painel, a planilha e o histórico no próprio repositório.
name: Pesquisa diária de preços

on:
  schedule:
    - cron: "0 11 * * *"   # 11h UTC = 8h em Brasília
  workflow_dispatch:         # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write            # necessário para salvar os resultados no repositório

concurrency:
  group: pesquisa-diaria     # nunca roda duas vezes ao mesmo tempo
  cancel-in-progress: false

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Pesquisar preços do dia
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python monitor.py --sim

      - name: Salvar resultados no repositório
        run: |
          git config user.name "monitor-de-precos"
          git config user.email "monitor-de-precos@users.noreply.github.com"
          git add dados docs saida
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Pesquisa de preços $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi
